server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: oc-admin
  
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_URL:localhost}:3306/oc_admin?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:ocadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:ocadmin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password:  ${SPRING_REDIS_PASSWORD:123456}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

jwt:
  secret: 8fK2sL9dQx4Tz7VwP1mR6bC3yN5hJ8uE
  expiration: 7200000  # 2小时

logging:
  level:
    com.nirvanafire.ocadmin: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
