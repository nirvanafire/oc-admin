name: Build and Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(date +%Y%m%d)-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          
      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Rename artifact
        run: |
          mv target/oc-admin-*.jar target/oc-admin-${{ steps.version.outputs.version }}.jar
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oc-admin-${{ steps.version.outputs.version }}
          path: target/oc-admin-${{ steps.version.outputs.version }}.jar
          retention-days: 30
          
      - name: Create Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: target/oc-admin-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build Docker image
        run: |
          docker build -t oc-admin:${{ steps.version.outputs.version }} .
          docker tag oc-admin:${{ steps.version.outputs.version }} oc-admin:latest
          
      - name: Save Docker image
        run: docker save oc-admin:${{ steps.version.outputs.version }} -o oc-admin-${{ steps.version.outputs.version }}.tar
        
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: oc-admin-docker-${{ steps.version.outputs.version }}
          path: oc-admin-${{ steps.version.outputs.version }}.tar
          retention-days: 7
